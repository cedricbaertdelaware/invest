<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — Investment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>
<style>
:root {
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--bg4:#1e1e28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f0f5;--text2:#8888aa;--text3:#555570;
  --accent:#6c63ff;--accent2:#8b85ff;
  --green:#22d3a0;--green-bg:rgba(34,211,160,0.08);
  --red:#f25c7a;--red-bg:rgba(242,92,122,0.08);
  --amber:#f5a623;--amber-bg:rgba(245,166,35,0.08);
  --blue:#38bdf8;--blue-bg:rgba(56,189,248,0.08);
  --card-bg:#111118;--card-border:rgba(255,255,255,0.06);
  --font:'Sora',sans-serif;--mono:'DM Mono',monospace;
  --radius:12px;--radius-sm:8px;--sidebar-w:220px;--tr:0.18s ease;
}
[data-theme="light"]{--bg:#f4f4f8;--bg2:#fff;--bg3:#f9f9fc;--bg4:#ededf5;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.12);
  --text:#12121a;--text2:#555570;--text3:#9999b0;
  --card-bg:#fff;--card-border:rgba(0,0,0,0.06);
  --green-bg:rgba(34,211,160,0.1);--red-bg:rgba(242,92,122,0.1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;overflow:hidden;}
#app{display:flex;height:100vh;overflow:hidden;}
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform var(--tr);}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid var(--border);}
.logo-mark{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--accent2);letter-spacing:-0.5px;}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-top:1px;}
.sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;}
.nav-section{margin-bottom:20px;}
.nav-section-label{font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:0 10px;margin-bottom:6px;display:block;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--text2);font-size:13px;border:1px solid transparent;user-select:none;transition:all var(--tr);}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:rgba(108,99,255,.12);color:var(--accent2);border-color:rgba(108,99,255,.2);font-weight:500;}
.nav-icon{width:16px;text-align:center;font-size:15px;}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:20px;min-width:20px;text-align:center;}
.sidebar-footer{padding:12px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
.topbar{height:56px;min-height:56px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg2);gap:16px;}
.topbar-title{font-size:15px;font-weight:500;flex:1;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
#content{flex:1;overflow-y:auto;padding:24px;}
.view{display:none;animation:fadeIn .2s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:18px 20px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.card-title{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.metric-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:16px 18px;}
.metric-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;}
.metric-value{font-size:24px;font-weight:500;font-family:var(--mono);color:var(--text);}
.metric-delta{font-size:12px;margin-top:4px;font-family:var(--mono);}
.metric-delta.pos{color:var(--green)}.metric-delta.neg{color:var(--red)}.metric-delta.neutral{color:var(--text3);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:8px 12px;border-bottom:1px solid var(--border);}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--text2);font-size:13px;}
.data-table td:first-child{color:var(--text);}
.data-table tr:last-child td{border-bottom:none;}
.data-table tr:hover td{background:var(--bg3);}
.data-table .mono{font-family:var(--mono);font-size:12px;}
.data-table .right{text-align:right;}
.asset-row{display:flex;align-items:center;gap:10px;}
.asset-avatar{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:var(--mono);flex-shrink:0;}
.av-etf{background:rgba(56,189,248,.12);color:var(--blue);}
.av-stock{background:rgba(108,99,255,.12);color:var(--accent2);}
.av-crypto{background:rgba(245,166,35,.1);color:var(--amber);}
.asset-name{font-size:13px;font-weight:500;color:var(--text);}
.asset-sub{font-size:11px;color:var(--text3);}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;letter-spacing:.04em;}
.badge-etf{background:var(--blue-bg);color:var(--blue);}
.badge-stock{background:rgba(108,99,255,.1);color:var(--accent2);}
.badge-crypto{background:var(--amber-bg);color:var(--amber);}
.pos{color:var(--green)}.neg{color:var(--red)}.neutral{color:var(--text3);}
.pos-bg{background:var(--green-bg);color:var(--green);padding:2px 8px;border-radius:20px;font-size:11px;font-family:var(--mono);}
.neg-bg{background:var(--red-bg);color:var(--red);padding:2px 8px;border-radius:20px;font-size:11px;font-family:var(--mono);}
.links-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.ext-link{font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--border2);color:var(--text3);text-decoration:none;transition:all var(--tr);cursor:pointer;background:transparent;display:inline-flex;align-items:center;gap:3px;}
.ext-link:hover{border-color:var(--accent);color:var(--accent2);background:rgba(108,99,255,.06);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:var(--font);cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);transition:all var(--tr);}
.btn:hover{background:var(--bg3);color:var(--text);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11px;}
.btn-icon{padding:7px;width:32px;height:32px;justify-content:center;}
.btn-danger{color:var(--red);border-color:rgba(242,92,122,.3);}
.btn-danger:hover{background:var(--red-bg);}
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px;}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border var(--tr);}
.form-input:focus{border-color:var(--accent);}
.form-select{appearance:none;cursor:pointer;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity var(--tr);}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;transform:translateY(8px);transition:transform var(--tr);}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-size:16px;font-weight:600;}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.alert-bar{background:var(--amber-bg);border:1px solid rgba(245,166,35,.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.tag{display:inline-flex;align-items:center;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--bg4);color:var(--text3);border:1px solid var(--border);}
.progress-bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .4s ease;}
.briefing-section{border-left:2px solid var(--accent);padding-left:14px;margin-bottom:18px;}
.briefing-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px;}
.briefing-item{font-size:13px;color:var(--text2);padding:4px 0;display:flex;justify-content:space-between;align-items:center;}
.search-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px 7px 32px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;width:220px;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px;}
#menu-btn{display:none;}
@media(max-width:768px){
  #sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #menu-btn{display:flex;}
  .grid-4{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr;}
  .grid-2{grid-template-columns:1fr;}
  #content{padding:16px;}
}
.mb-16{margin-bottom:16px;}.mb-24{margin-bottom:24px;}.mt-16{margin-top:16px;}
.flex{display:flex;}.flex-center{display:flex;align-items:center;}.gap-8{gap:8px;}.gap-12{gap:12px;}.ml-auto{margin-left:auto;}
.text-sm{font-size:12px;}.text-xs{font-size:11px;}.mono{font-family:var(--mono);}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.note-text{font-size:12px;color:var(--text3);font-style:italic;margin-top:2px;}
.empty-state{text-align:center;padding:48px 24px;color:var(--text3);}
.empty-state .ei{font-size:32px;margin-bottom:12px;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-size:15px;font-weight:500;}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">&#9672; folio</div>
      <div class="logo-sub">investment tracker</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">
        <span class="nav-section-label">Overzicht</span>
        <div class="nav-item active" data-view="dashboard" onclick="navigate('dashboard')"><span class="nav-icon">&#9641;</span> Dashboard</div>
        <div class="nav-item" data-view="briefing" onclick="navigate('briefing')"><span class="nav-icon">&#9728;</span> Morning Briefing <span class="nav-badge" id="alert-badge">0</span></div>
      </div>
      <div class="nav-section">
        <span class="nav-section-label">Portfolio</span>
        <div class="nav-item" data-view="portfolio" onclick="navigate('portfolio')"><span class="nav-icon">&#9647;</span> Posities</div>
        <div class="nav-item" data-view="allocation" onclick="navigate('allocation')"><span class="nav-icon">&#9716;</span> Allocatie</div>
      </div>
      <div class="nav-section">
        <span class="nav-section-label">Watchlist</span>
        <div class="nav-item" data-view="watchlist" onclick="navigate('watchlist')"><span class="nav-icon">&#9672;</span> Watchlist</div>
        <div class="nav-item" data-view="alerts" onclick="navigate('alerts')"><span class="nav-icon">&#9678;</span> Alerts</div>
      </div>
      <div class="nav-section">
        <span class="nav-section-label">Data</span>
        <div class="nav-item" data-view="settings" onclick="navigate('settings')"><span class="nav-icon">&#9881;</span> Instellingen</div>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="nav-item" onclick="exportJSON()" style="font-size:12px;"><span class="nav-icon">&#8595;</span> Export JSON</div>
      <div class="nav-item" onclick="exportCSV()" style="font-size:12px;"><span class="nav-icon">&#8595;</span> Export CSV</div>
    </div>
  </nav>
  <div id="main">
    <div class="topbar">
      <button class="btn btn-icon" id="menu-btn" onclick="toggleSidebar()">&#9776;</button>
      <div class="topbar-title" id="topbar-title">Dashboard</div>
      <div class="topbar-actions">
        <span id="last-update" style="font-size:11px;color:var(--text3);font-family:var(--mono);"></span>
        <button class="btn btn-sm" onclick="toggleTheme()" title="Toggle theme">&#9681;</button>
        <button class="btn btn-sm btn-primary" onclick="openAddModal()">+ Toevoegen</button>
      </div>
    </div>
    <div id="content">

      <!-- DASHBOARD -->
      <div class="view active" id="view-dashboard">
        <div class="grid-4 mb-24" id="dashboard-metrics"></div>
        <div class="grid-2 mb-16">
          <div class="card">
            <div class="card-header"><span class="card-title">Portfolio Waarde (30 dagen)</span></div>
            <div style="height:180px;"><canvas id="chart-value"></canvas></div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Verdeling per type</span></div>
            <div style="display:flex;align-items:center;gap:16px;">
              <div style="width:140px;height:140px;flex-shrink:0;"><canvas id="chart-alloc"></canvas></div>
              <div id="alloc-legend" style="flex:1;"></div>
            </div>
          </div>
        </div>
        <div class="card mb-16">
          <div class="card-header">
            <span class="card-title">Posities</span>
            <a onclick="navigate('portfolio')" style="font-size:12px;color:var(--accent2);cursor:pointer;">Alle posities &#8594;</a>
          </div>
          <div style="overflow-x:auto;" id="dashboard-positions"></div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><span class="card-title">Watchlist</span>
              <a onclick="navigate('watchlist')" style="font-size:12px;color:var(--accent2);cursor:pointer;">Alle &#8594;</a>
            </div>
            <div id="dashboard-watchlist"></div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Actieve Alerts</span></div>
            <div id="dashboard-alerts"></div>
          </div>
        </div>
      </div>

      <!-- MORNING BRIEFING -->
      <div class="view" id="view-briefing"><div id="briefing-content"></div></div>

      <!-- PORTFOLIO -->
      <div class="view" id="view-portfolio">
        <div class="section-header">
          <div class="section-title">Mijn Posities</div>
          <div class="flex gap-8">
            <div class="search-wrap">
              <span class="search-icon">&#8857;</span>
              <input type="text" class="search-input" placeholder="Zoek ticker..." id="portfolio-search" oninput="renderPortfolio()">
            </div>
            <button class="btn btn-primary" onclick="openAddModal('position')">+ Positie</button>
          </div>
        </div>
        <div class="card" style="overflow-x:auto;" id="portfolio-table-wrap">
          <div id="portfolio-table"></div>
        </div>
      </div>

      <!-- ALLOCATION -->
      <div class="view" id="view-allocation">
        <div class="section-title mb-16">Allocatie Analyse</div>
        <div class="grid-3 mb-16" id="alloc-metrics"></div>
        <div class="grid-2 mb-16">
          <div class="card"><div class="card-header"><span class="card-title">Per type</span></div><div style="height:200px;"><canvas id="chart-alloc2"></canvas></div></div>
          <div class="card"><div class="card-header"><span class="card-title">Top posities</span></div><div style="height:200px;"><canvas id="chart-alloc3"></canvas></div></div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Allocatie vs targets</span>
            <button class="btn btn-sm" onclick="navigate('settings')">Bewerk targets</button>
          </div>
          <div id="alloc-bars"></div>
        </div>
      </div>

      <!-- WATCHLIST -->
      <div class="view" id="view-watchlist">
        <div class="section-header mb-16">
          <div class="section-title">Watchlist</div>
          <div class="flex gap-8" style="flex-wrap:wrap;">
            <div class="search-wrap">
              <span class="search-icon">&#8857;</span>
              <input type="text" class="search-input" placeholder="Zoek..." id="watchlist-search" oninput="renderWatchlist()">
            </div>
            <select class="form-input form-select" style="width:130px;" id="wl-filter" onchange="renderWatchlist()">
              <option value="">Alle types</option>
              <option value="etf">ETF</option>
              <option value="stock">Aandelen</option>
              <option value="crypto">Crypto</option>
            </select>
            <button class="btn btn-primary" onclick="openAddModal('watch')">+ Toevoegen</button>
          </div>
        </div>
        <div id="watchlist-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;"></div>
      </div>

      <!-- ALERTS -->
      <div class="view" id="view-alerts">
        <div class="section-header mb-16">
          <div class="section-title">Alerts</div>
          <button class="btn btn-primary" onclick="openAddModal('alert')">+ Alert</button>
        </div>
        <div id="alerts-list"></div>
      </div>

      <!-- SETTINGS -->
      <div class="view" id="view-settings">
        <div class="section-title mb-16">Instellingen &amp; Data</div>
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><span class="card-title">Import / Export</span></div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <button class="btn" onclick="exportJSON()" style="justify-content:center;">&#8595; Export JSON backup</button>
              <button class="btn" onclick="exportCSV()" style="justify-content:center;">&#8595; Export CSV</button>
              <div style="border-top:1px solid var(--border);padding-top:10px;">
                <label class="btn" style="cursor:pointer;justify-content:center;width:100%;">&#8593; Import JSON <input type="file" accept=".json" onchange="importJSON(event)" style="display:none;"></label>
              </div>
              <button class="btn btn-danger" onclick="clearAllData()" style="justify-content:center;">&#9888; Alle data wissen</button>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><span class="card-title">Voorkeuren</span></div>
            <div class="form-group">
              <label class="form-label">Basisvaluta</label>
              <select class="form-input form-select" id="setting-currency" onchange="saveSetting('currency',this.value)">
                <option value="EUR">EUR &#8364;</option><option value="USD">USD $</option><option value="GBP">GBP &#163;</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Thema</label>
              <select class="form-input form-select" id="setting-theme" onchange="setTheme(this.value)">
                <option value="dark">Dark</option><option value="light">Light</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Allocatie targets (JSON) — etf/stock/crypto %</label>
              <textarea class="form-input" id="targets-json" rows="4" style="resize:vertical;font-family:var(--mono);font-size:11px;" onblur="saveTargets()"></textarea>
            </div>
          </div>
        </div>
        <div class="card mt-16">
          <div class="card-header"><span class="card-title">Over Folio</span></div>
          <p style="font-size:13px;color:var(--text2);line-height:1.8;">
            Folio slaat alle data lokaal op via localStorage &#8212; geen server, geen account, geen cloud.<br>
            Exporteer regelmatig een JSON backup als reserve.<br><br>
            <strong>Databronnen:</strong> Yahoo Finance &#183; Binance &#183; Euronext &#183; Morningstar &#183; JustETF &#183; STOXX<br>
            <strong>Versie:</strong> 1.0.0 &#8212; GitHub Pages ready &#183; Volledig offline bruikbaar
          </p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Toevoegen</div>
      <button class="btn btn-icon" onclick="closeModalDirect()">&#x2715;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ============================================================
// FOLIO - Investment Tracker
// Pure vanilla JS + Chart.js via CDN
// localStorage only — no backend, no server
// ============================================================

// ---------- DEMO DATA ----------
const DEMO_PORTFOLIO = [
  {id:'p1',ticker:'IWDA',name:'iShares Core MSCI World',type:'etf',qty:42,avgPrice:78.50,currentPrice:92.14,tags:['core','langetermijn'],note:'Kernsatelliet strategie — basis positie',fav:true},
  {id:'p2',ticker:'VWCE',name:'Vanguard FTSE All-World',type:'etf',qty:28,avgPrice:98.20,currentPrice:118.30,tags:['core'],note:'',fav:false},
  {id:'p3',ticker:'EMIM',name:'iShares MSCI EM IMI',type:'etf',qty:15,avgPrice:31.80,currentPrice:29.45,tags:['emerging'],note:'Hogere volatiliteit, long term',fav:false},
  {id:'p4',ticker:'ASML',name:'ASML Holding NV',type:'stock',qty:3,avgPrice:620.00,currentPrice:684.90,tags:['tech','euronext'],note:'Sterkste positie in chips',fav:true},
  {id:'p5',ticker:'UCB',name:'UCB SA',type:'stock',qty:10,avgPrice:138.00,currentPrice:142.60,tags:['pharma','bel20'],note:'',fav:false},
  {id:'p6',ticker:'BTC',name:'Bitcoin',type:'crypto',qty:0.08,avgPrice:42000,currentPrice:88420,tags:['crypto'],note:'Long term hold — DCA strategie',fav:true},
  {id:'p7',ticker:'ETH',name:'Ethereum',type:'crypto',qty:0.5,avgPrice:2100,currentPrice:3120,tags:['crypto'],note:'',fav:false},
];
const DEMO_WATCHLIST = [
  {id:'w1',ticker:'CSPX',name:'iShares Core S&P 500',type:'etf',note:'Alternatief voor meer US exposure',fav:false,tags:['us','large-cap']},
  {id:'w2',ticker:'MEUD',name:'Amundi MSCI Europe',type:'etf',note:'',fav:false,tags:['europe']},
  {id:'w3',ticker:'AAPL',name:'Apple Inc.',type:'stock',note:'Wachten op betere instapprijs',fav:true,tags:['tech','us']},
  {id:'w4',ticker:'SOL',name:'Solana',type:'crypto',note:'',fav:false,tags:['crypto','altcoin']},
  {id:'w5',ticker:'AB',name:'Anheuser-Busch InBev',type:'stock',note:'Dividend aandeel',fav:false,tags:['dividend','bel20']},
];
const DEMO_ALERTS = [
  {id:'a1',ticker:'IWDA',type:'price_below',value:88.00,note:'Bijkopen kans',active:true},
  {id:'a2',ticker:'IWDA',type:'price_above',value:100.00,note:'Overweging herbalanceren',active:true},
  {id:'a3',ticker:'BTC',type:'price_below',value:75000,note:'DCA moment',active:true},
  {id:'a4',ticker:'ASML',type:'price_above',value:750.00,note:'Take profit niveau',active:true},
  {id:'a5',ticker:'UCB',type:'dividend',value:0,note:'Dividend uitkering Q2',active:true},
];
const DEMO_SNAPS = (()=>{
  const s=[];let v=10200;
  for(let i=29;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    v+=(Math.random()-0.42)*280;
    s.push({date:d.toISOString().split('T')[0],totalValue:Math.max(8000,v)});
  }
  return s;
})();

// ---------- LINK GENERATORS ----------
const LINKS={
  yahoo:(t,type)=>`https://finance.yahoo.com/quote/${type==='crypto'?t+'-EUR':t}`,
  morningstar:(t,type)=>{
    if(type==='etf') return `https://www.morningstar.com/etfs/xams/${t.toLowerCase()}/quote`;
    if(type==='crypto') return `https://www.morningstar.com/assets/${t.toLowerCase()}usd/quote`;
    return `https://www.morningstar.com/stocks/xams/${t.toLowerCase()}/quote`;
  },
  justetf:(t)=>`https://www.justetf.com/en/search.html?search=ETFS&query=${t}`,
  euronext:(t)=>`https://www.euronext.com/en/search-instruments?q=${t}`,
  stoxx:(t)=>`https://www.stoxx.com/index-details.html?isin=${t}`,
  binance:(t)=>`https://www.binance.com/en/trade/${t}_EUR`,
};
function getLinks(ticker,type){
  const l=[{label:'Yahoo',url:LINKS.yahoo(ticker,type)},{label:'Morningstar',url:LINKS.morningstar(ticker,type)}];
  if(type==='etf'){l.push({label:'JustETF',url:LINKS.justetf(ticker)},{label:'Euronext',url:LINKS.euronext(ticker)},{label:'STOXX',url:LINKS.stoxx(ticker)});}
  if(type==='stock') l.push({label:'Euronext',url:LINKS.euronext(ticker)});
  if(type==='crypto') l.push({label:'Binance',url:LINKS.binance(ticker)});
  return l;
}
function renderLinks(ticker,type){
  return getLinks(ticker,type).map(l=>`<a class="ext-link" href="${l.url}" target="_blank" rel="noopener">&#8599; ${l.label}</a>`).join('');
}

// ---------- STORAGE ----------
function load(k){try{return JSON.parse(localStorage.getItem('folio_'+k));}catch{return null;}}
function save(k,v){try{localStorage.setItem('folio_'+k,JSON.stringify(v));}catch(e){console.warn(e);}}
function getData(){return{
  portfolio:load('portfolio')||DEMO_PORTFOLIO,
  watchlist:load('watchlist')||DEMO_WATCHLIST,
  alerts:load('alerts')||DEMO_ALERTS,
  settings:load('settings')||{currency:'EUR',theme:'dark',targets:{etf:60,stock:25,crypto:15}},
  snapshots:load('snapshots')||DEMO_SNAPS,
};}

// ---------- HELPERS ----------
function fmtC(val,d=2){
  const s=getData().settings.currency;
  const sym=s==='USD'?'$':s==='GBP'?'£':'€';
  if(Math.abs(val)>=10000) return sym+val.toLocaleString('nl-BE',{minimumFractionDigits:0,maximumFractionDigits:0});
  if(Math.abs(val)>=1000) return sym+val.toLocaleString('nl-BE',{minimumFractionDigits:d,maximumFractionDigits:d});
  return sym+val.toFixed(d);
}
function fmtPct(v){return(v>=0?'+':'')+v.toFixed(2)+'%';}
function uid(){return Math.random().toString(36).slice(2,9);}
function cc(v){return v>=0?'pos':'neg';}
function fmtDelta(v){return`<span class="${cc(v)}">${fmtPct(v)}</span>`;}
function typeLabel(t){return{etf:'ETF',stock:'Aandeel',crypto:'Crypto'}[t]||t;}
function typeBadge(t){return`<span class="badge badge-${t}">${typeLabel(t)}</span>`;}
function calcPos(p){
  const cv=p.qty*p.currentPrice,cb=p.qty*p.avgPrice,pl=cv-cb,pp=cb>0?(pl/cb)*100:0;
  return{cv,cb,pl,pp};
}
function totalValue(){return getData().portfolio.reduce((s,p)=>s+p.qty*p.currentPrice,0);}
function totalCost(){return getData().portfolio.reduce((s,p)=>s+p.qty*p.avgPrice,0);}

// ---------- NAVIGATION ----------
const VTITLES={dashboard:'Dashboard',briefing:'Morning Briefing',portfolio:'Portefeuille',allocation:'Allocatie',watchlist:'Watchlist',alerts:'Alerts',settings:'Instellingen'};
function navigate(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelector(`[data-view="${v}"]`)?.classList.add('active');
  document.getElementById('topbar-title').textContent=VTITLES[v]||v;
  if(window.innerWidth<=768) document.getElementById('sidebar').classList.remove('open');
  const renders={dashboard:renderDashboard,briefing:renderBriefing,portfolio:renderPortfolio,allocation:renderAllocation,watchlist:renderWatchlist,alerts:renderAlerts,settings:renderSettings};
  if(renders[v]) renders[v]();
}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');setTheme(c==='dark'?'light':'dark');}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const{settings}=getData();settings.theme=t;save('settings',settings);
  const s=document.getElementById('setting-theme');if(s)s.value=t;
}

// ---------- DASHBOARD ----------
let cV=null,cA=null;
function renderDashboard(){
  const{portfolio,alerts,snapshots}=getData();
  const tv=totalValue(),tc=totalCost(),pl=tv-tc,pp=tc>0?(pl/tc)*100:0;
  const prev=snapshots.length>=2?snapshots[snapshots.length-2].totalValue:tv;
  const dayD=tv-prev,dayP=prev>0?(dayD/prev)*100:0;
  document.getElementById('dashboard-metrics').innerHTML=`
    <div class="metric-card"><div class="metric-label">Totale Waarde</div><div class="metric-value">${fmtC(tv,0)}</div><div class="metric-delta ${cc(dayD)}">${dayD>=0?'&#9650;':'&#9660;'} ${fmtC(Math.abs(dayD),0)} vandaag</div></div>
    <div class="metric-card"><div class="metric-label">Winst / Verlies</div><div class="metric-value" style="color:${pl>=0?'var(--green)':'var(--red)'};">${fmtC(pl,0)}</div><div class="metric-delta ${cc(pp)}">${fmtPct(pp)} all-time</div></div>
    <div class="metric-card"><div class="metric-label">Ingelegd</div><div class="metric-value">${fmtC(tc,0)}</div><div class="metric-delta neutral">${portfolio.length} posities</div></div>
    <div class="metric-card"><div class="metric-label">Actieve Alerts</div><div class="metric-value">${alerts.filter(a=>a.active).length}</div><div class="metric-delta neutral">te controleren</div></div>`;
  renderValueChart();renderAllocChart();
  const top5=[...portfolio].sort((a,b)=>(b.qty*b.currentPrice)-(a.qty*a.currentPrice)).slice(0,5);
  document.getElementById('dashboard-positions').innerHTML=top5.length?`
    <table class="data-table" style="min-width:500px;">
      <thead><tr><th>Instrument</th><th>Type</th><th class="right">Waarde</th><th class="right">W/V%</th><th class="right">Links</th></tr></thead>
      <tbody>${top5.map(p=>{
        const{cv,pp}=calcPos(p);
        return`<tr onclick="openDetail('${p.id}','pos')" style="cursor:pointer;">
          <td><div class="asset-row"><div class="asset-avatar av-${p.type}">${p.ticker.slice(0,3)}</div>
          <div><div class="asset-name">${p.ticker}${p.fav?' &#9733;':''}</div><div class="asset-sub truncate" style="max-width:160px;">${p.name}</div></div></div></td>
          <td>${typeBadge(p.type)}</td>
          <td class="right mono">${fmtC(cv)}</td>
          <td class="right">${fmtDelta(pp)}</td>
          <td class="right" onclick="event.stopPropagation();"><div class="links-row" style="justify-content:flex-end;">${renderLinks(p.ticker,p.type)}</div></td>
        </tr>`;
      }).join('')}</tbody>
    </table>`:'<div class="empty-state"><div class="ei">&#9647;</div><p>Geen posities nog</p></div>';
  const{watchlist}=getData();
  document.getElementById('dashboard-watchlist').innerHTML=watchlist.slice(0,4).map(w=>`
    <div class="flex-center gap-8" style="padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="openDetail('${w.id}','wl')">
      <div class="asset-avatar av-${w.type}">${w.ticker.slice(0,3)}</div>
      <div style="flex:1;min-width:0;"><div class="asset-name">${w.ticker}</div><div class="asset-sub truncate">${w.name}</div></div>
      ${typeBadge(w.type)}
    </div>`).join('') || '<div class="empty-state" style="padding:16px;"><p>Geen items</p></div>';
  const activeAlerts=alerts.filter(a=>a.active).slice(0,4);
  document.getElementById('dashboard-alerts').innerHTML=activeAlerts.length?activeAlerts.map(a=>{
    const ic=a.type==='price_above'?'&#9650;':a.type==='price_below'?'&#9660;':'&#9678;';
    const cl=a.type==='price_above'?'var(--green)':a.type==='price_below'?'var(--red)':'var(--amber)';
    return`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);">
      <span style="color:${cl};font-size:16px;">${ic}</span>
      <span style="font-size:13px;"><strong>${a.ticker}</strong> ${a.type==='price_above'?'boven':a.type==='price_below'?'onder':''} ${a.type!=='dividend'&&a.type!=='note'?fmtC(a.value):''}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--text3);">${a.note}</span>
    </div>`;
  }).join(''):'<div class="empty-state" style="padding:16px;"><p>Geen actieve alerts</p></div>';
  document.getElementById('alert-badge').textContent=alerts.filter(a=>a.active).length;
}

function renderValueChart(){
  const{snapshots}=getData();
  const ctx=document.getElementById('chart-value')?.getContext('2d');
  if(!ctx)return;if(cV){cV.destroy();}
  const labels=snapshots.map(s=>s.date.slice(5));
  const data=snapshots.map(s=>s.totalValue);
  const color=data[data.length-1]>=data[0]?'#22d3a0':'#f25c7a';
  cV=new Chart(ctx,{type:'line',data:{labels,datasets:[{data,borderColor:color,borderWidth:2,pointRadius:0,fill:true,
    backgroundColor:(ctx2)=>{const g=ctx2.chart.ctx.createLinearGradient(0,0,0,180);g.addColorStop(0,color+'22');g.addColorStop(1,'transparent');return g;},tension:0.4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>' '+fmtC(c.raw)}}},
      scales:{x:{grid:{display:false},ticks:{color:'#555570',font:{family:'DM Mono',size:10},maxTicksLimit:8},border:{display:false}},
              y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#555570',font:{family:'DM Mono',size:10},callback:v=>'€'+(v/1000).toFixed(0)+'k'},border:{display:false}}}}});
}

function renderAllocChart(){
  const{portfolio}=getData();if(!portfolio.length)return;
  const tv=totalValue();
  const bt={etf:0,stock:0,crypto:0};
  portfolio.forEach(p=>bt[p.type]=(bt[p.type]||0)+p.qty*p.currentPrice);
  const colors=['#38bdf8','#6c63ff','#f5a623'],labels=['ETF','Aandelen','Crypto'],vals=[bt.etf,bt.stock,bt.crypto];
  const ctx=document.getElementById('chart-alloc')?.getContext('2d');
  if(!ctx)return;if(cA){cA.destroy();}
  cA=new Chart(ctx,{type:'doughnut',data:{labels,datasets:[{data:vals,backgroundColor:colors.map(c=>c+'cc'),borderColor:colors,borderWidth:1.5,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'70%',plugins:{legend:{display:false},tooltip:{callbacks:{label:(c)=>' '+fmtC(c.raw)+' ('+((c.raw/tv)*100).toFixed(1)+'%)'}}}}}); 
  document.getElementById('alloc-legend').innerHTML=labels.map((l,i)=>`
    <div class="flex-center gap-8" style="margin-bottom:8px;">
      <div style="width:10px;height:10px;border-radius:2px;background:${colors[i]};flex-shrink:0;"></div>
      <div style="flex:1;font-size:12px;color:var(--text2);">${l}</div>
      <div style="font-size:12px;font-family:var(--mono);color:var(--text);">${(vals[i]/tv*100).toFixed(1)}%</div>
    </div>`).join('');
}

// ---------- MORNING BRIEFING ----------
function renderBriefing(){
  const{portfolio,alerts,snapshots}=getData();
  const tv=totalValue(),tc=totalCost(),pl=tv-tc,pp=tc>0?(pl/tc)*100:0;
  const prev=snapshots.length>=2?snapshots[snapshots.length-2].totalValue:tv;
  const dayD=tv-prev,dayP=prev>0?(dayD/prev)*100:0;
  const sorted=[...portfolio].map(p=>({...p,pp:calcPos(p).pp})).sort((a,b)=>b.pp-a.pp);
  const tg=sorted[0],tl=sorted[sorted.length-1];
  const now=new Date();
  const gr=now.getHours()<12?'Goedemorgen':now.getHours()<18?'Goedemiddag':'Goedenavond';
  const bt={etf:0,stock:0,crypto:0};portfolio.forEach(p=>bt[p.type]=(bt[p.type]||0)+p.qty*p.currentPrice);
  document.getElementById('briefing-content').innerHTML=`
    <div class="card mb-16" style="border-color:rgba(108,99,255,.2);background:rgba(108,99,255,.04);">
      <div style="font-size:22px;font-weight:500;margin-bottom:4px;">${gr} &#9728;</div>
      <div style="color:var(--text2);font-size:13px;">${now.toLocaleDateString('nl-BE',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
    </div>
    <div class="grid-3 mb-16">
      <div class="metric-card"><div class="metric-label">Portfolio waarde</div><div class="metric-value">${fmtC(tv,0)}</div><div class="metric-delta ${cc(dayP)}">${fmtPct(dayP)} vs gisteren</div></div>
      <div class="metric-card"><div class="metric-label">All-time rendement</div><div class="metric-value" style="color:${pl>=0?'var(--green)':'var(--red)'};">${fmtC(pl,0)}</div><div class="metric-delta ${cc(pp)}">${fmtPct(pp)}</div></div>
      <div class="metric-card"><div class="metric-label">Actieve alerts</div><div class="metric-value">${alerts.filter(a=>a.active).length}</div><div class="metric-delta neutral">te controleren</div></div>
    </div>
    <div class="card mb-16">
      <div class="briefing-section">
        <div class="briefing-title">Beste performer</div>
        ${tg?`<div class="briefing-item"><span>${tg.ticker} &#8212; ${tg.name}</span><span class="pos-bg">${fmtPct(tg.pp)}</span></div>`:''}
      </div>
      <div class="briefing-section">
        <div class="briefing-title">Zwakste performer</div>
        ${tl?`<div class="briefing-item"><span>${tl.ticker} &#8212; ${tl.name}</span><span class="${tl.pp>=0?'pos-bg':'neg-bg'}">${fmtPct(tl.pp)}</span></div>`:''}
      </div>
      <div class="briefing-section">
        <div class="briefing-title">Allocatie verdeling</div>
        ${Object.entries(bt).map(([k,v])=>`<div class="briefing-item"><span>${typeLabel(k)}</span><span class="mono">${tv>0?(v/tv*100).toFixed(1):0}%</span></div>`).join('')}
      </div>
      <div class="briefing-section" style="border-left-color:var(--amber);margin-bottom:0;">
        <div class="briefing-title">Actieve alerts</div>
        ${alerts.filter(a=>a.active).map(a=>`
          <div class="briefing-item">
            <span>${a.ticker} &#8212; ${{price_above:'target boven',price_below:'watch onder',alloc_above:'allocatie boven',dividend:'dividend',note:'notitie'}[a.type]} ${a.type!=='dividend'&&a.type!=='note'?fmtC(a.value):''}</span>
            <span style="font-size:11px;color:var(--text3);">${a.note}</span>
          </div>`).join('') || '<div style="color:var(--text3);font-size:13px;">Geen actieve alerts</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><span class="card-title">Alle posities</span></div>
      <div style="overflow-x:auto;">
      <table class="data-table" style="min-width:500px;">
        <thead><tr><th>Instrument</th><th class="right">Prijs</th><th class="right">Waarde</th><th class="right">W/V%</th></tr></thead>
        <tbody>${portfolio.map(p=>{const{cv,pp}=calcPos(p);return`<tr>
          <td><div class="asset-row"><div class="asset-avatar av-${p.type}">${p.ticker.slice(0,3)}</div>
          <div><div class="asset-name">${p.ticker}</div><div class="asset-sub">${p.name}</div></div></div></td>
          <td class="right mono">${fmtC(p.currentPrice)}</td>
          <td class="right mono">${fmtC(cv)}</td>
          <td class="right">${fmtDelta(pp)}</td>
        </tr>`}).join('')}</tbody>
      </table></div>
    </div>`;
}

// ---------- PORTFOLIO ----------
function renderPortfolio(){
  const{portfolio}=getData();
  const q=document.getElementById('portfolio-search')?.value?.toLowerCase()||'';
  const filtered=portfolio.filter(p=>!q||p.ticker.toLowerCase().includes(q)||p.name.toLowerCase().includes(q));
  const tv=totalValue();
  document.getElementById('portfolio-table').innerHTML=filtered.length?`
    <table class="data-table" style="min-width:800px;">
      <thead><tr><th>Instrument</th><th>Type</th><th class="right">Aantal</th><th class="right">Gem.prijs</th><th class="right">Huidig</th><th class="right">Waarde</th><th class="right">W/V &#8364;</th><th class="right">W/V%</th><th class="right">Alloc%</th><th></th></tr></thead>
      <tbody>${filtered.map(p=>{

          <td>${typeBadge(p.type)}</td>

          <td class="right mono">${fmtC(p.avgPrice)}</td>
          <td class="right mono">${fmtC(p.currentPrice)}</td>
          <td class="right mono">${fmtC(cv)}</td>
          <td class="right"><span class="${cc(pl)}">${pl>=0?'+':''}${fmtC(pl)}</span></td>
          <td class="right"><span class="${pp>=0?'pos-bg':'neg-bg'}">${fmtPct(pp)}</span></td>
          <td class="right" style="width:90px;">
            <div style="font-size:11px;font-family:var(--mono);margin-bottom:3px;">${alloc.toFixed(1)}%</div>

          </td>

          </td>
        </tr>`;
      }).join('')}</tbody>
    </table>`:
    `<div class="empty-state"><div class="ei">&#9647;</div><p>${q?'Geen resultaten voor "'+q+'"':'Voeg je eerste positie toe'}</p></div>`;
}

// ---------- ALLOCATION ----------
let cA2=null,cA3=null;
function renderAllocation(){
  const{portfolio,settings}=getData();
  const tv=totalValue();
  const bt={etf:0,stock:0,crypto:0};
  portfolio.forEach(p=>bt[p.type]=(bt[p.type]||0)+p.qty*p.currentPrice);
  const targets=settings.targets||{etf:60,stock:25,crypto:15};
  document.getElementById('alloc-metrics').innerHTML=Object.entries(bt).map(([k,v])=>`
    <div class="metric-card">
      <div class="metric-label">${typeLabel(k)}</div>
      <div class="metric-value">${tv>0?(v/tv*100).toFixed(1):0}%</div>
      <div class="metric-delta neutral">${fmtC(v,0)}</div>
    </div>`).join('');
  const ctx2=document.getElementById('chart-alloc2')?.getContext('2d');
  if(ctx2){if(cA2)cA2.destroy();
    cA2=new Chart(ctx2,{type:'doughnut',data:{labels:['ETF','Aandelen','Crypto'],
      datasets:[{data:[bt.etf,bt.stock,bt.crypto],backgroundColor:['#38bdf8bb','#6c63ffbb','#f5a623bb'],borderColor:['#38bdf8','#6c63ff','#f5a623'],borderWidth:1.5}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:'#8888aa',font:{family:'Sora',size:11},padding:12}}}}});}
  const ctx3=document.getElementById('chart-alloc3')?.getContext('2d');
  if(ctx3){if(cA3)cA3.destroy();
    const sorted=[...portfolio].sort((a,b)=>(b.qty*b.currentPrice)-(a.qty*a.currentPrice)).slice(0,8);
    cA3=new Chart(ctx3,{type:'bar',data:{labels:sorted.map(p=>p.ticker),
      datasets:[{data:sorted.map(p=>tv>0?((p.qty*p.currentPrice/tv)*100).toFixed(1):0),backgroundColor:'#6c63ff88',borderColor:'#6c63ff',borderWidth:1,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{color:'#555570',font:{family:'DM Mono',size:11}},border:{display:false}},
                y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#555570',font:{family:'DM Mono',size:10},callback:v=>v+'%'},border:{display:false}}}}});}
  document.getElementById('alloc-bars').innerHTML=Object.entries(bt).map(([k,v])=>{
    const actual=tv>0?(v/tv*100):0,target=targets[k]||0,diff=actual-target;
    return`<div style="margin-bottom:18px;">
      <div class="flex-center gap-8" style="margin-bottom:6px;">
        <span style="font-size:13px;font-weight:500;">${typeLabel(k)}</span>
        <span class="mono text-xs" style="color:var(--text3);">actueel: ${actual.toFixed(1)}%</span>
        <span class="mono text-xs" style="color:var(--text3);">target: ${target}%</span>
        <span class="ml-auto mono text-xs ${diff>5?'neg':diff<-5?'pos':'neutral'}">${diff>0?'+':''}${diff.toFixed(1)}%</span>
      </div>
      <div style="position:relative;height:6px;background:var(--bg4);border-radius:3px;">
        <div style="position:absolute;height:100%;width:${Math.min(actual,100)}%;background:var(--accent);border-radius:3px;"></div>
        <div style="position:absolute;top:-3px;left:${Math.min(target,100)}%;width:2px;height:12px;background:var(--amber);border-radius:1px;" title="Target ${target}%"></div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px;">${diff>5?'&#9888; Overwogen &#8212; overweeg herbalancering':diff<-5?'&#9888; Onderwogen &#8212; overweeg bijkopen':'&#10003; Binnen target range'}</div>
    </div>`;}).join('');
}

// ---------- SAVE ACTIONS ----------
function savePosition(id){
  const ticker=document.getElementById('f-ticker')?.value?.toUpperCase().trim();
  if(!ticker){alert('Ticker is verplicht');return;}
  const qty=parseFloat(document.getElementById('f-qty')?.value);
  const avg=parseFloat(document.getElementById('f-avg')?.value);
  if(!qty||!avg){alert('Aantal en aankoopprijs zijn verplicht');return;}
  const{portfolio}=getData();
  const item={id:id||uid(),ticker,name:document.getElementById('f-name')?.value||ticker,
    type:document.getElementById('f-type')?.value||'etf',qty,avgPrice:avg,
    currentPrice:parseFloat(document.getElementById('f-cur')?.value)||avg,
    tags:(document.getElementById('f-tags')?.value||'').split(',').map(t=>t.trim()).filter(Boolean),
    note:document.getElementById('f-note')?.value||'',fav:document.getElementById('f-fav')?.checked||false};
  const idx=portfolio.findIndex(p=>p.id===id);
  if(idx>=0)portfolio[idx]=item;else portfolio.push(item);
  save('portfolio',portfolio);takeSnapshot();closeModalDirect();renderPortfolio();renderDashboard();
}
function saveWatchitem(id){
  const ticker=document.getElementById('f-ticker')?.value?.toUpperCase().trim();
  if(!ticker){alert('Ticker is verplicht');return;}
  const{watchlist}=getData();
  const item={id:id||uid(),ticker,name:document.getElementById('f-name')?.value||ticker,
    type:document.getElementById('f-type')?.value||'etf',
    tags:(document.getElementById('f-tags')?.value||'').split(',').map(t=>t.trim()).filter(Boolean),
    note:document.getElementById('f-note')?.value||'',fav:document.getElementById('f-fav')?.checked||false};
  const idx=watchlist.findIndex(w=>w.id===id);
  if(idx>=0)watchlist[idx]=item;else watchlist.push(item);
  save('watchlist',watchlist);closeModalDirect();renderWatchlist();
}
function saveAlert(id){
  const ticker=document.getElementById('f-ticker')?.value?.toUpperCase().trim();
  if(!ticker){alert('Ticker is verplicht');return;}
  const{alerts}=getData();
  const item={id:id||uid(),ticker,type:document.getElementById('f-alert-type')?.value||'price_below',
    value:parseFloat(document.getElementById('f-alert-val')?.value)||0,
    note:document.getElementById('f-note')?.value||'',active:true};
  const idx=alerts.findIndex(a=>a.id===id);
  if(idx>=0)alerts[idx]=item;else alerts.push(item);
  save('alerts',alerts);closeModalDirect();renderAlerts();
  document.getElementById('alert-badge').textContent=alerts.filter(a=>a.active).length;
}

// ---------- DELETE ----------
function deletePosition(id){if(!confirm('Positie verwijderen?'))return;const{portfolio}=getData();save('portfolio',portfolio.filter(p=>p.id!==id));renderPortfolio();renderDashboard();}
function deleteWatchitem(id){if(!confirm('Item verwijderen?'))return;const{watchlist}=getData();save('watchlist',watchlist.filter(w=>w.id!==id));renderWatchlist();}
function deleteAlert(id){if(!confirm('Alert verwijderen?'))return;const{alerts}=getData();save('alerts',alerts.filter(a=>a.id!==id));renderAlerts();document.getElementById('alert-badge').textContent=getData().alerts.filter(a=>a.active).length;}
function toggleAlert(id){const{alerts}=getData();const a=alerts.find(x=>x.id===id);if(a)a.active=!a.active;save('alerts',alerts);renderAlerts();document.getElementById('alert-badge').textContent=alerts.filter(a=>a.active).length;}

// ---------- DETAIL MODAL ----------
function openDetail(id,type){
  const{portfolio,watchlist}=getData();

  if(!item)return;
  document.getElementById('detail-title').textContent=item.ticker+' — '+item.name;
  let body='';
  if(type==='pos'){
    const{cv,cb,pl,pp}=calcPos(item);
    body+=`<div class="grid-2" style="margin-bottom:16px;">
      <div class="metric-card"><div class="metric-label">Huidige waarde</div><div class="metric-value">${fmtC(cv)}</div></div>
      <div class="metric-card"><div class="metric-label">Winst/Verlies</div><div class="metric-value" style="color:${pl>=0?'var(--green)':'var(--red)'};">${pl>=0?'+':''}${fmtC(pl)}</div><div class="metric-delta ${cc(pp)}">${fmtPct(pp)}</div></div>
    </div>
    <div class="card mb-16" style="background:var(--bg3);">
      <table style="width:100%;font-size:13px;">
        <tr><td style="color:var(--text3);padding:5px 0;">Aantal</td><td style="text-align:right;font-family:var(--mono);">${item.qty}</td></tr>
        <tr><td style="color:var(--text3);padding:5px 0;">Gem. aankoopprijs</td><td style="text-align:right;font-family:var(--mono);">${fmtC(item.avgPrice)}</td></tr>
        <tr><td style="color:var(--text3);padding:5px 0;">Huidige prijs</td><td style="text-align:right;font-family:var(--mono);">${fmtC(item.currentPrice)}</td></tr>
        <tr><td style="color:var(--text3);padding:5px 0;">Kostbasis</td><td style="text-align:right;font-family:var(--mono);">${fmtC(cb)}</td></tr>
      </table>
    </div>`;
  }
  body+=`<div style="margin-bottom:12px;"><div class="form-label" style="margin-bottom:8px;">Links</div><div class="links-row">${renderLinks(item.ticker,item.type)}</div></div>
    ${item.tags?.length?`<div style="margin-bottom:12px;"><div class="form-label" style="margin-bottom:6px;">Tags</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${item.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`:''}
    ${item.note?`<div><div class="form-label" style="margin-bottom:4px;">Notitie</div><div style="font-size:13px;color:var(--text2);font-style:italic;">${item.note}</div></div>`:''}
    <div class="modal-footer"><button class="btn" onclick="closeDetailDirect()">Sluiten</button><button class="btn btn-primary" onclick="closeDetailDirect();openEditModal('${item.id}','${type}')">Bewerken</button></div>`;
  document.getElementById('detail-body').innerHTML=body;
  document.getElementById('detail-overlay').classList.add('open');
}

// ---------- MODAL CONTROLS ----------
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');}
function closeDetail(e){if(e.target===document.getElementById('detail-overlay'))closeDetailDirect();}
function closeDetailDirect(){document.getElementById('detail-overlay').classList.remove('open');}

// ---------- SNAPSHOT ----------
function takeSnapshot(){
  const{snapshots}=getData();
  const today=new Date().toISOString().split('T')[0],tv=totalValue();
  const last=snapshots[snapshots.length-1];
  if(!last||last.date!==today)snapshots.push({date:today,totalValue:tv});
  else last.totalValue=tv;
  if(snapshots.length>365)snapshots.shift();
  save('snapshots',snapshots);
}

// ---------- IMPORT / EXPORT ----------
function exportJSON(){
  const d={portfolio:getData().portfolio,watchlist:getData().watchlist,alerts:getData().alerts,settings:getData().settings,snapshots:getData().snapshots,exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='folio-backup-'+new Date().toISOString().split('T')[0]+'.json';a.click();
  URL.revokeObjectURL(url);
}
function exportCSV(){
  const{portfolio}=getData();const tv=totalValue();
  const rows=[['Ticker','Naam','Type','Aantal','Gem.prijs','Huidige prijs','Waarde','W/V EUR','W/V %','Allocatie %']];
  portfolio.forEach(p=>{const{cv,pl,pp}=calcPos(p);rows.push([p.ticker,p.name,p.type,p.qty,p.avgPrice.toFixed(2),p.currentPrice.toFixed(2),cv.toFixed(2),pl.toFixed(2),pp.toFixed(2),(tv>0?cv/tv*100:0).toFixed(2)]);});
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='folio-'+new Date().toISOString().split('T')[0]+'.csv';a.click();
  URL.revokeObjectURL(url);
}
function importJSON(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{try{
    const d=JSON.parse(e.target.result);
    if(d.portfolio)save('portfolio',d.portfolio);
    if(d.watchlist)save('watchlist',d.watchlist);
    if(d.alerts)save('alerts',d.alerts);
    if(d.settings)save('settings',d.settings);
    if(d.snapshots)save('snapshots',d.snapshots);
    alert('Import gelukt! Pagina wordt herladen.');location.reload();
  }catch(err){alert('Fout bij importeren: '+err.message);}};
  reader.readAsText(file);
}
function clearAllData(){
  if(!confirm('ALLE data wissen? Dit kan niet ongedaan worden gemaakt!'))return;
  if(!confirm('Echt zeker?'))return;
  ['portfolio','watchlist','alerts','settings','snapshots'].forEach(k=>localStorage.removeItem('folio_'+k));
  location.reload();
}

// ---------- INIT ----------
function init(){
  const{settings}=getData();
  document.documentElement.setAttribute('data-theme',settings.theme||'dark');
  takeSnapshot();
  renderDashboard();
  document.getElementById('last-update').textContent='Lokale data ' + new Date().toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('alert-badge').textContent=getData().alerts.filter(a=>a.active).length;
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){closeModalDirect();closeDetailDirect();}});
}
window.addEventListener('DOMContentLoaded',init);
<\/script>
